services:
  postgres:
    image: postgres:18-alpine
    container_name: chronos-postgres
    volumes:
      - pgdata:/var/lib/posgresql
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"

volumes:
  pgdata:
